<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonel Mercado · Contenido Marketing a la Acción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Plan: marca ALIADIG (negro, amarillo, morado). Barra lateral de ruta + panel de lección tipo web. */
:root{
  --bg:#0A0A0A; --panel:#141414; --panel2:#1B1B1B; --line:#2A2A2A;
  --y:#FFD700; --p:#8B5CF6; --t:#F5F5F5; --mut:#A3A3A3;
  --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.app{display:grid;grid-template-columns:292px 1fr;height:100%}
/* sidebar */
.side{background:#0E0E0E;border-right:1px solid var(--line);overflow-y:auto;padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px;border:0;background:none;color:inherit;text-align:left;border-radius:14px;width:100%}
.brand:hover{background:#181818}
.brand img.ava{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:#1b1535;border:2px solid var(--y);flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}.brand span{font-size:12px;color:var(--mut);font-weight:600}
.prog{padding:0 6px}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px}
.bar{height:6px;border-radius:6px;background:#242424;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--y),var(--p));transition:width .4s}
.phase{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--p);font-weight:800;padding:8px 8px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:8px 8px;border-radius:10px;font-size:14px;font-weight:600}
.nav button:hover{background:#181818;color:var(--t)}
.nav button.on{background:#201a38;color:var(--t);box-shadow:inset 3px 0 0 var(--y)}
.nav .n{flex:none;width:24px;height:24px;border-radius:8px;background:#1f1f1f;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--mut)}
.nav button.on .n{background:var(--y);color:#0A0A0A;border-color:var(--y)}
.nav button.seen .n{background:var(--ok);color:#06210f;border-color:var(--ok)}
.nav button.seen.on .n{background:var(--y);color:#0A0A0A;border-color:var(--y)}
/* main */
.main{overflow-y:auto;position:relative}
.top{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px}
.top .crumb{font-size:13px;color:var(--mut);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--y)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--t);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700}
.btn:hover{border-color:#444}
.btn.y{background:var(--y);color:#0A0A0A;border-color:var(--y)}
.btn.p{background:var(--p);border-color:var(--p)}
.menu{display:none}
.view{max-width:1000px;margin:0 auto;padding:28px 24px 40px;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:1fr 230px;gap:24px;align-items:center;background:radial-gradient(120% 140% at 100% 0%,#2a1d52 0%,#141414 55%);border:1px solid var(--line);border-radius:28px;padding:30px}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--y);font-weight:800;margin-bottom:10px}
h1{font-size:clamp(30px,4.4vw,48px);line-height:1.04;letter-spacing:-.03em;font-weight:900;text-wrap:balance}
h1 .y,.y{color:var(--y)}
.goal{color:#D4D4D4;font-size:17px;margin-top:12px;max-width:52ch}
.art svg{width:100%;height:auto;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--p);font-weight:800;margin-bottom:12px}
.card.hl{border-color:#4b3a8a;background:linear-gradient(180deg,#1c1535,#141414)}
.card.yl h3{color:var(--y)}
ul.chk{list-style:none;display:flex;flex-direction:column;gap:10px}
ul.chk li{display:flex;gap:10px;font-size:15.5px}
ul.chk li::before{content:"→";color:var(--y);font-weight:900;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#1c1c1c;border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
a.chip{text-decoration:none;color:var(--y);border-color:#4a4310}
a.chip:hover{background:#2a2508}
/* tabs */
.tabs .tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs .tb button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:12px;font-size:14px;font-weight:700}
.tabs .tb button.on{background:var(--y);border-color:var(--y);color:#0A0A0A}
.tabs .tb button .nn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#0003;margin-right:6px;font-size:11px;font-weight:900}
.tabs .pn{display:none}
.tabs .pn.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pn h4{font-size:21px;letter-spacing:-.02em;margin-bottom:6px}
.pn p{color:#D4D4D4;margin-bottom:8px}
.pn .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#241d44;color:#cfc3ff}
.tag.g{background:#0f2a18;color:#86efac}.tag.w{background:#33260a;color:#fcd34d}.tag.r{background:#341212;color:#fca5a5}
/* details */
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0}
details+details{margin-top:10px}
summary{list-style:none;padding:14px 18px;font-weight:800;display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-size:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--y);font-size:22px;line-height:1;font-weight:700}
details[open] summary::after{content:"−"}
details .d{padding:0 18px 16px;color:#D4D4D4;font-size:15.5px}
/* forms / calc */
.calc{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:4px}
.field input,.field textarea{width:100%;background:#0d0d0d;border:1px solid var(--line);color:var(--t);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus{border-color:var(--y);outline:none}
.outs{display:flex;flex-direction:column;gap:10px}
.out{background:#0d0d0d;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.out span{font-size:13px;color:var(--mut);font-weight:600}
.out b{font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.out.big b{font-size:26px;color:var(--y)}
.verdict{border-radius:14px;padding:14px 16px;font-weight:700;border:1px solid}
.verdict.g{background:#0f2a18;border-color:#1f6a3a;color:#bbf7d0}
.verdict.w{background:#33260a;border-color:#7a5a12;color:#fde68a}
.verdict.r{background:#341212;border-color:#7f2323;color:#fecaca}
.verdict.n{background:#1b1632;border-color:#4b3a8a;color:#ddd6fe}
.note{font-size:13px;color:var(--mut)}
.pre{background:#0d0d0d;border:1px dashed #3a3a3a;border-radius:14px;padding:14px;font-size:15px;color:#E5E5E5;white-space:pre-wrap}
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pcard .row b{font-size:15px}
/* funnel */
.fun{display:flex;flex-direction:column;gap:8px;align-items:center}
.fun button{border:0;color:#0A0A0A;font-weight:900;font-size:16px;padding:14px 8px;border-radius:14px;background:linear-gradient(90deg,var(--y),#F59E0B);transition:transform .15s}
.fun button:hover{transform:scale(1.02)}
.fun button.on{outline:3px solid var(--p);outline-offset:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap}
/* palette */
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw div{flex:1;min-width:110px;border-radius:14px;padding:46px 12px 10px;font-size:12px;font-weight:800;border:1px solid var(--line)}
/* nav bottom */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.sr{position:absolute;left:-9999px}
/* present mode */
body.present .app{grid-template-columns:1fr}
body.present .side{display:none}
body.present .view{max-width:1180px;font-size:112%}
body.present .menu{display:none}
/* responsive */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 20% 0 0;z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:12px 0 40px #000a}
  body.open .side{transform:none}
  .menu{display:inline-block}
  .hero{grid-template-columns:1fr;padding:22px}
  .art{max-width:170px;margin:0 auto;order:-1}
  .grid2,.grid3,.calc{grid-template-columns:1fr}
  .top{padding:10px 16px}.view{padding:20px 16px 34px}
}
.art svg .ring{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
.art svg .orbit{animation:spin 16s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.art svg .ic{transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(-2.2px)}50%{transform:translateY(2.2px)}}
@keyframes pulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.14)}}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
@keyframes wob{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes roll{0%{transform:translateX(-3.5px) rotate(-120deg)}50%{transform:translateX(3.5px) rotate(120deg)}100%{transform:translateX(-3.5px) rotate(-120deg)}}
@keyframes circ{0%{transform:translate(0,-2.4px)}25%{transform:translate(2.4px,0)}50%{transform:translate(0,2.4px)}75%{transform:translate(-2.4px,0)}100%{transform:translate(0,-2.4px)}}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-7deg) scale(1.08)}40%{transform:rotate(6deg) scale(1.12)}60%{transform:rotate(-4deg) scale(1.06)}80%{transform:rotate(2deg)}}
@keyframes lift{0%,100%{transform:translateY(1px) rotate(2deg)}50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-4px) scaleY(1.06)}60%{transform:translateY(0) scaleY(.92)}}
@keyframes twirl{0%{transform:rotate(0) scale(.9)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(.9)}}
.a-gear{animation:spin 6s linear infinite}.a-network{animation:spin 12s linear infinite}
.a-rocket{animation:lift 2.2s ease-in-out infinite}
.a-coin,.a-copy{animation:flip 2.4s ease-in-out infinite}
.a-search{animation:circ 3s linear infinite}
.a-target,.a-bulb{animation:pulse 1.8s ease-in-out infinite}
.a-box,.a-funnel{animation:roll 3.4s ease-in-out infinite}
.a-spark{animation:twirl 5s ease-in-out infinite}
.a-wand,.a-flag,.a-store,.a-book{animation:wob 1.8s ease-in-out infinite}
.a-mega{animation:shake 1.6s ease-in-out infinite}
.a-gift{animation:bounce 1.5s ease-in-out infinite}
.a-chart,.a-layers,.a-image,.a-home{animation:floaty 2s ease-in-out infinite}
.art:hover svg .ic{animation-duration:.9s}
.teacher{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}
.teacher img{width:150px;height:150px;border-radius:26px;object-fit:cover;object-position:50% 15%;background:#1b1535;border:2px solid var(--y)}
@media (max-width:900px){.teacher{grid-template-columns:1fr;text-align:center}.teacher img{margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* pantalla de entrada */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 35%,#2a1d52 0%,#0A0A0A 62%);transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash.out .sp-in{transform:scale(1.08)}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px;transition:transform .6s ease}
.sp-btn{position:relative;border:0;background:none;padding:0;border-radius:50%;width:min(260px,62vw);aspect-ratio:1}
.sp-btn::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,var(--y),var(--p),var(--y));animation:spin 6s linear infinite}
.sp-btn::after{content:"";position:absolute;inset:-10px;border-radius:50%;box-shadow:0 0 70px 6px #8b5cf655;animation:glow 2.4s ease-in-out infinite}
.sp-btn img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#1b1535;border:5px solid #0A0A0A;display:block;transition:transform .25s}
.sp-btn:hover img{transform:scale(1.04)}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
.sp-k{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--y);font-weight:800;margin-top:22px}
.sp-n{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:-.03em;line-height:1.05}
.sp-s{color:var(--mut);font-size:16px;max-width:34ch}
.sp-top{display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--y);color:#0A0A0A;padding:14px 26px;border-radius:22px;margin-bottom:26px;box-shadow:0 10px 40px #ffd70033;animation:nudge 1.8s ease-in-out infinite;position:relative}
.sp-top b{font-size:clamp(17px,3.2vw,24px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
.sp-top span{font-size:13px;font-weight:700;opacity:.75}
.sp-top::after{content:"";position:absolute;left:50%;bottom:-10px;width:20px;height:20px;background:var(--y);transform:translateX(-50%) rotate(45deg);border-radius:4px}
.sp-ptr{position:absolute;z-index:2;right:2%;bottom:4%;width:58px;height:58px;border-radius:50%;background:var(--y);display:grid;place-items:center;box-shadow:0 6px 24px #000a}
.sp-ptr::before,.sp-ptr::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--y);animation:ripple 2s ease-out infinite}
.sp-ptr::after{animation-delay:1s}
.sp-ptr svg{position:relative;animation:tap 2s ease-in-out infinite}
@keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-3px) scale(.9)}}
.sp-h{margin-top:10px;font-size:13px;font-weight:700;color:#d4d4d4;border:1px solid var(--line);background:#141414;padding:8px 16px;border-radius:999px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

#reg{position:fixed;inset:0;z-index:300;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#reg.on{display:flex}
#reg form{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(480px,100%);display:flex;flex-direction:column;gap:10px;margin:auto}
#reg h2{font-size:22px;letter-spacing:-.02em}#reg p.s{color:var(--mut);font-size:14px}
#reg label{font-size:13px;font-weight:700;color:var(--y);display:flex;flex-direction:column;gap:4px}
#reg input,#reg textarea{background:#0A0A0A;border:1px solid var(--line);border-radius:10px;color:var(--t);padding:10px 12px;font:inherit;font-size:15px}
#reg input:focus,#reg textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
#reg .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){#reg .g2{grid-template-columns:1fr}}
#reg .chk{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500;color:var(--mut);font-size:12.5px}
#reg .chk input{margin-top:3px;accent-color:var(--y)}
#reg .err{color:var(--bad);font-size:13px;min-height:16px}
.gal{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.gal a{flex:none;scroll-snap-align:start;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0A0A0A;display:block}
.gal img{display:block;height:min(460px,70vh);width:auto}
</style>
</head>
<body>
<div id="splash" role="dialog" aria-label="Pantalla de entrada">
  <div class="sp-in">
    <div class="sp-top"><b>Dale clic para comenzar tu preparación</b></div>
    <button type="button" class="sp-btn" id="enter" aria-label="Entrar a la presentación"><img src="assets/leonel.gif" alt="Leonel Mercado"><span class="sp-ptr" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5" stroke-linejoin="round"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/></svg></span></button>
    <div class="sp-k">Docente y consultor</div>
    <div class="sp-n">Leonel Mercado</div>
    <div class="sp-s">Marketing digital en acción: de la idea al negocio lanzado</div>
  </div>
</div>
<div id="reg" role="dialog" aria-label="Registro del estudiante"><form id="regf" novalidate>
<h2>Antes de empezar</h2><p class="s">Regístrate para guardar tu avance en el curso.</p>
<label>Nombre completo<input name="nombre" autocomplete="name" required></label>
<div class="g2"><label>Cédula<input name="cedula" inputmode="numeric" required></label><label>Teléfono / WhatsApp<input name="telefono" inputmode="tel" autocomplete="tel" required></label></div>
<label>Correo electrónico<input name="correo" type="email" autocomplete="email" required></label>
<div class="g2"><label>Entidad (a cuál perteneces)<input name="entidad" placeholder="Ej. SENA, otra entidad" required></label><label>Grupo / ficha<input name="grupo" required></label></div>
<label>Nota adicional (opcional)<textarea name="nota" rows="2"></textarea></label>
<label class="chk"><input type="checkbox" name="acepto" required><span>Autorizo el tratamiento de mis datos personales por parte de Leonel Mercado con fines académicos y de seguimiento del curso (Ley 1581 de 2012).</span></label>

</form></div>
<div class="app">

      <button class="btn menu" id="menu" aria-label="Abrir menú">☰ Menú</button>
      <div class="crumb" id="crumb"></div>
      <button class="btn" id="present">Presentar</button>
    </div>
    <div class="view" id="view"></div>
  </section>
</div>

<script>
/* ---------- datos ---------- */
const IG='https://www.instagram.com/leomergbusiness/', WA='https://wa.me/573163473137', WEB='https://leomergbusiness.vercel.app';
const META_LIB='https://www.facebook.com/ads/library/', TT_CC='https://ads.tiktok.com/business/creativecenter';
const RELEASIT='https://apps.shopify.com/releasit-cod-order-form?s=ref&ref=aliadig&locale=es', DROPI='https://app.dropi.co/aliadig', DROPKILLER='https://dropkiller.com?fpr=991qwq';

}

    {t:'D · Dolor',h:'¿Qué tan urgente es el problema?',p:'Entre más cerca esté de tu dinero o de tu tiempo, más urgente. Un producto que resuelve un problema ahora se vende más fácil que uno que "estaría bien tener".',tags:[['Prioridad 1','g']]},

  {k:'tabs',title:'Manual de testeo: antes de testear, pasa el producto por 3 filtros',items:[
    {t:'Los 3 filtros',h:'Antes de testear, pasa el producto por 3 filtros: C · V · D',p:'D · Dolor: resuelve un problema grande.\nV · Valor: se percibe caro.\nC · Competencia: no lo vende todo el mundo.\n\nSe revisan en ese orden, y el que más pesa es el Dolor.\nTip: si el producto falla en Dolor, no gastes tiempo en los otros dos filtros: descártalo y busca otro.',tags:[['Orden: D → V → C','g']]},
    {t:'D · Dolor',h:'Dolor: qué tan grande es el problema',p:'Qué tan grande es el problema por categoría (escala de 1 a 10):\nSalud y belleza: 10\nBienestar: 9\nHogar: 5\nCocina: 2\n\nEjemplo de dolor alto: el nervio ciático, que quita el sueño y hasta el caminar.\nEjemplo de dolor bajo: una espátula; nadie se estresa por voltear un huevo.\n\nEl dolor es la magnitud del problema que resuelves. Entre más grande, más probabilidad de que el producto funcione.\nTip: pregúntate: ¿alguien pagaría hoy por quitarse este problema?',tags:[['Filtro 1','g']]},
    {t:'V · Valor',h:'Valor: que se perciba caro',p:'Un producto de $90.000 (USD 29) que parece una cosita genera la pregunta "¿tanto por esta cosita?". El mismo precio en un producto que se nota que lo vale sí se vende.\n\nEl valor percibido es lo que la gente cree que vale en el anuncio frente a lo que ve que cuesta en la página.\nLo que más lo sube es el tamaño y que no se consiga fácil en una tienda.\nTip: los productos pequeños y fáciles de encontrar en cualquier tienda casi nunca justifican un precio alto.',tags:[['Filtro 2','w']]},
    {t:'C · Competencia',h:'Competencia: que no esté saturado',p:'Hay un techo: 500 ventas en 7 días, o 3.000 ventas en total. Si pasa cualquiera de los dos, lo sueltas ("saturado"); si está por debajo, todavía cabes.\n\nRevísalo en Dropkiller, sumando a todos los proveedores de ese producto.\nMeta y TikTok funcionan como subasta: quien invierte $3.100.000 (USD 1.000) al día le gana a tus $100.000 (USD 32,3).',tags:[['Filtro 3','w']]},
    {t:'El método',h:'Testear es preguntarle al mercado: ¿lo comprarías?',p:'Paso 1: monta la página del producto.\n(Siguientes pasos del método: por completar con el manual de testeo.)',tags:[['Manual de testeo','']]}]},

 cuentas:{icon:'network',title:'Fanpage, Business Manager y políticas',goal:'Entender cómo se organiza un negocio en Meta y TikTok, de tu perfil personal a la cuenta publicitaria, y cómo evitar bloqueos.',
  learn:['Del perfil personal a la Página, el portafolio comercial y la cuenta publicitaria','Cómo se estructura TikTok: cuenta, Business Center y cuenta publicitaria','Qué es el pixel y para qué sirve medir','Resumen de políticas y causas frecuentes de bloqueo'],
  practice:'Dibuja la estructura de tu negocio en Meta y en TikTok y crea tu portafolio comercial con una Página.',deliver:'Diagrama de cuentas y checklist de políticas para tu negocio.',tools:['Meta Business Suite','Administrador de Anuncios','TikTok Business Center','TikTok Ads Manager'],
  links:[['Políticas de publicidad de Meta','https://transparency.meta.com/policies/ad-standards/'],['Meta Business Suite','https://business.facebook.com/'],['Política de cuentas de TikTok Ads','https://ads.tiktok.com/help/article/actor-policy'],['Cuentas suspendidas en TikTok','https://ads.tiktok.com/help/article/account-suspension-faq']],
  w:[{k:'tabs',num:true,title:'Meta: de tu perfil al anuncio',items:[
    {t:'Perfil',h:'Tu perfil personal de Facebook',p:'Es tu identidad y de aquí parte todo. Pero no es el lugar para administrar un negocio: si algo le pasa al perfil, puedes perder el acceso a lo que dependía de él.'},
    {t:'Página',h:'La fanpage del negocio',p:'La Página es la cara pública de tu marca y se crea desde tu perfil. También sirve una cuenta profesional de Instagram.'},
    {t:'Portafolio',h:'Business Manager (portafolio comercial)',p:'En Meta Business Suite creas tu portafolio comercial con el nombre y el correo del negocio. Ahí viven la Página, las cuentas publicitarias, el pixel y las personas con acceso. Es gratis. Según varias guías, cada persona puede crear máximo dos portafolios, así que no los malgastes.'},
    {t:'Cuenta publicitaria',h:'Donde pagas y administras anuncios',p:'Dentro del portafolio creas la cuenta publicitaria y registras el método de pago. Una cuenta creada en un portafolio no se pasa a otro y no se elimina, solo se cierra: decide bien a quién pertenece desde el primer día.'},
    {t:'Datos',h:'Pixel y API de conversiones',p:'Conectas el pixel (conjunto de datos) para medir visitas, formularios y compras de tu tienda. Sin datos, la plataforma optimiza a ciegas.'},
    {t:'Equipo',h:'Personas y socios',p:'A cada persona le das el mínimo acceso que necesita. A una agencia o freelancer le das acceso como socio, que puedes revocar, en lugar de compartir tu contraseña.'}]},
   {k:'tabs',num:true,title:'TikTok: de la cuenta al anuncio',items:[
    {t:'Cuenta',h:'Cuenta de TikTok',p:'Tu cuenta personal o de marca, donde publicas contenido orgánico.'},
    {t:'Empresa',h:'Cuenta de empresa',p:'Cambias a cuenta de empresa para usar las herramientas de negocio, como estadísticas y la música comercial.'},
    {t:'Business Center',h:'Tu centro de negocio',p:'Reúne cuentas publicitarias, pixel y personas. Desde un Business Center verificado, un administrador puede crear cuentas publicitarias. Hay un límite que varía según el tipo de centro.'},
    {t:'Ads Manager',h:'La cuenta publicitaria',p:'Aquí creas campañas, grupos de anuncios y anuncios. Para aprobar la cuenta, TikTok pide un sitio web oficial del negocio, y el nombre de tus documentos debe coincidir con el de la cuenta y el sitio.'},
    {t:'Vendedor',h:'Cuenta de vendedor',p:'Cada plataforma tiene su opción para vender dentro de ella: en Meta, el catálogo y Commerce Manager; en TikTok, TikTok Shop. Revisa si están disponibles en tu país antes de planear tu venta.'}]},
   {k:'tabs',title:'Políticas: por qué te pueden bloquear',items:[
    {t:'Meta',h:'Resumen de las Normas de Publicidad',p:'• Los anuncios se revisan con herramientas automáticas antes y después de publicarse, incluida tu página de destino\n• Prácticas engañosas: promesas falsas, estafas o usar la imagen de un famoso para atraer clics\n• Contenido impactante, violento, para adultos o con groserías\n• Salud y cuerpo: mensajes que hagan sentir mal a la persona para vender dietas o productos de adelgazamiento\n• Productos ilegales o inseguros y prácticas discriminatorias\n• Crear cuentas con automatización o manejar activos conectados a cuentas ya bloqueadas\n• Infracciones repetidas: se rechaza el anuncio y la cuenta puede restringirse o inhabilitarse',tags:[['Si fue un error, pide revisión en Calidad de la cuenta','w']]},
    {t:'TikTok',h:'Causas frecuentes de suspensión',p:'• Cambiar la página de destino después de crear la campaña\n• Conducta con intención maliciosa al crear el anuncio\n• Violar las normas de publicidad o promover productos prohibidos o restringidos en tu país\n• Identidad engañosa o datos que no coinciden con tus documentos\n• Usar logos o productos sin licencia\n• Reportes o quejas de usuarios\n• Métodos de pago no legítimos',tags:[['Mira la pestaña Salud de la cuenta en Ads Manager','w'],['Las graves pueden suspender de inmediato','r']]},

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let seen={};
try{seen=JSON.parse(localStorage.getItem('aliadig-visto')||'{}')}catch(e){seen={}}
function save(){try{localStorage.setItem('aliadig-visto',JSON.stringify(seen))}catch(e){}}
const ORDER=['inicio',...PHASES.flatMap(p=>p.ids)];
const N={};ORDER.filter(i=>MOD[i]).forEach((id,i)=>N[id]=i+1);
const TOTALMOD=Object.keys(N).length;
const TITLES={inicio:'Inicio',beneficios:'Beneficios'};
ORDER.forEach(id=>{if(MOD[id])TITLES[id]=MOD[id].title});

/* ---------- barra lateral ---------- */
function buildNav(){
  let h=`<button data-go="inicio" id="nv-inicio"><span class="n">⌂</span>Inicio</button>`;
  PHASES.forEach(p=>{
    h+=`<div class="phase">${p.t}</div>`;
    p.ids.forEach(id=>{
      const m=MOD[id];
      h+=`<button data-go="${id}" id="nv-${id}"><span class="n">${m?N[id]:'★'}</span>${esc(TITLES[id])}</button>`;
    });
  });
  $('#nav').innerHTML=h;
}
function paintNav(cur){
  ORDER.forEach(id=>{const b=document.getElementById('nv-'+id);if(!b)return;b.classList.toggle('on',id===cur);b.classList.toggle('seen',!!seen[id])});
  const total=ORDER.length-1, done=ORDER.filter(i=>i!=='inicio'&&seen[i]).length, pc=Math.round(done/total*100);
  $('#pct').textContent=pc+'%';$('#barfill').style.width=pc+'%';
}

/* ---------- widgets ---------- */
let uid=0;
function tabs(w){
  const id='t'+(++uid);
  const tb=w.items.map((it,i)=>`<button type="button" data-tab="${id}:${i}" class="${i===0?'on':''}">${w.num?`<span class="nn">${i+1}</span>`:''}${esc(it.t)}</button>`).join('');
  const pn=w.items.map((it,i)=>`<div class="pn ${i===0?'on':''}" data-pn="${id}:${i}"><h4>${esc(it.h||it.t)}</h4><p>${esc(it.p).replace(/\n/g,'<br>')}</p>${it.tags?`<div class="meta">${it.tags.map(t=>`<span class="tag ${t[1]}">${esc(t[0])}</span>`).join('')}</div>`:''}</div>`).join('');
  return `<div class="card tabs" data-g="${id}">${w.title?`<h3>${esc(w.title)}</h3>`:''}<div class="tb">${tb}</div>${pn}</div>`;
}
function gallery(w){return `<div class="card">${w.title?`<h3>${esc(w.title)}</h3>`:''}<div class="gal">${w.imgs.map((f,i)=>`<a href="${f}" target="_blank" rel="noopener"><img src="${f}" alt="${esc(w.alts[i]||'')}" loading="lazy"></a>`).join('')}</div><p style="color:var(--mut);font-size:13px">Desliza para ver todas. Toca una imagen para verla en grande.</p></div>`}
function field(id,label,val,type='number',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${val}" ${extra} inputmode="${type==='number'?'numeric':'text'}"></div>`}
function out(id,label,big){return `<div class="out ${big?'big':''}"><span>${label}</span><b id="${id}">-</b></div>`}

  return `<div class="card"><h3>Biblioteca de prompts (cambia lo que va entre corchetes)</h3><div class="pcard">${P.map((p,i)=>`<details ${i===0?'open':''}><summary>${esc(p[0])}</summary><div class="d"><div class="pre" id="pr-${i}">${esc(p[1])}</div><p style="margin-top:10px"><button class="btn y" type="button" data-copy="pr-${i}">Copiar prompt</button></p></div></details>`).join('')}</div></div>`},
 skilltpl:()=>`<div class="card hl"><h3>Ejemplo: tu primera skill (archivo SKILL.md)</h3><div class="pre" id="sk-tpl">---
name: guion-anuncio-30s
description: Úsala cuando pidan un guion de anuncio de 30 segundos para TikTok o Reels de un producto o servicio.
---
# Guion de anuncio de 30 segundos
1. Si faltan, pregunta producto, público y oferta.
2. Escribe 3 versiones: gancho (0 a 3 s), problema, demostración, oferta y llamado a la acción.
3. Tono cercano, español colombiano, sin promesas exageradas ni afirmaciones de salud.
4. Entrega en tabla: tiempo | voz | imagen.</div><p style="margin-top:12px"><button class="btn y" type="button" data-copy="sk-tpl">Copiar plantilla</button></p><p class="note" style="margin-top:8px">Guárdala en una carpeta con el nombre de la skill y súbela en la configuración de tu IA, o pega su contenido al iniciar el chat.</p></div>`,
 glossary:()=>{
  const G=[['CPM','Costo por mil impresiones: lo que pagas para que 1.000 personas vean tu anuncio. Si es alto, revisa el gancho o el público.'],['CPC','Costo por clic: lo que pagas cada vez que alguien hace clic. Si es alto, la promesa no engancha.'],['CTR','Porcentaje de personas que hacen clic sobre las que vieron el anuncio (clics ÷ impresiones).'],['CPL','Costo por lead: lo que pagas por cada mensaje, formulario o cita.'],['CPA','Costo por adquisición: lo que la plataforma registra que pagas por cada compra.'],['CAC','Costo de adquisición de cliente: gastado ÷ ventas reales cerradas. Es el que decide si ganas dinero.'],['ROAS','Retorno sobre la inversión publicitaria: ingresos ÷ gasto en anuncios.'],['Ticket','El precio que paga el cliente por tu producto o servicio.']];
  return `<div class="card"><h3>Glosario de métricas</h3>${G.map((g,i)=>`<details ${i===0?'open':''}><summary>${g[0]}</summary><div class="d">${esc(g[1])}</div></details>`).join('')}</div>`},
 funnel:()=>{
  const S=[['Atención','Cuánta gente te ve','CPM y primeros 3 segundos','Cambia el gancho o el público','82%'],['Interés','Cuántos hacen clic','CPC y CTR','Cambia la promesa y el titular','68%'],['Deseo','Cuántos dejan sus datos o agregan al carrito','Conversión de la página','Mejora prueba social, garantía y claridad','54%'],['Acción','Cuántos compran','CPA o CAC','Revisa precio, cierre y seguimiento','40%']];
  return `<div class="card"><h3>El embudo (toca cada etapa)</h3><div class="fun" data-fun>${S.map((s,i)=>`<button type="button" data-f="${i}" class="${i===0?'on':''}" style="width:${s[4]}">${s[0]}</button>`).join('')}</div><div id="fun-d" style="margin-top:16px"></div><script type="application/json" id="fun-data">${JSON.stringify(S)}<\/script></div>`},
 rubric:()=>{
  const R=['Oferta validada con el filtro D·V·C·E','Tienda o página de producto lista','Creativos y copy listos para testear','Campaña con tope de gasto y regla 3-5-1','Lectura de métricas y decisión final'];
  return `<div class="card calc" data-calc="rubric"><div><h3>Rúbrica de autoevaluación (0 a 4)</h3><div class="fields" style="grid-template-columns:1fr">${R.map((r,i)=>`<div class="field"><label for="rb-${i}">${r}: <b id="rb-v${i}">2</b></label><input id="rb-${i}" type="range" min="0" max="4" step="1" value="2"></div>`).join('')}</div></div><div class="outs">${out('rb-t','Puntaje total',1)}<div class="verdict n" id="rb-m">-</div></div></div>`}
};

/* ---------- interacciones ---------- */
const num=id=>{const e=document.getElementById(id);return e?parseFloat(e.value)||0:0};
const setT=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
function calcAll(){
  if(document.getElementById('mg-precio')){
    const p=num('mg-precio'),c=num('mg-costo'),f=num('mg-flete'),o=num('mg-otros')/100;
    const u=p-c-f-p*o;
    setT('mg-u',fmt(u));setT('mg-m',p?(u/p*100).toFixed(1)+'%':'-');setT('mg-cpa',fmt(Math.max(u,0)));
  }
  if(document.getElementById('mt-ticket')){
    const t=num('mt-ticket'),pc=num('mt-pct')/100,g=num('mt-gasto'),l=num('mt-leads'),v=num('mt-ventas');
    const max=t*pc;setT('mt-cac',fmt(max));setT('mt-real',v>0?fmt(g/v):'Sin ventas aún');
    let cls='n',msg='';
    if(v>0){const cac=g/v;
      if(cac<=max){cls='g';msg='Ganó: tu CAC está dentro del máximo. Sostén y escala de forma gradual.'}
      else if(cac<=max*1.25){cls='w';msg='Sostenlo: pasa un poco el máximo. Mira un día más antes de decidir.'}
      else{cls='r';msg='Muy caro: supera el máximo por bastante. Apaga y prueba otra oferta.'}}
    else if(g>=max){cls='r';msg='Apágalo: llegaste al 100% del máximo sin ventas.'}
    else if(g>=max*.75){if(l>=5){cls='g';msg='Sigue: ya tienes 5 leads o más al 75% del máximo. Falta la venta.'}else{cls='r';msg='Apágalo: al 75% del máximo necesitabas 5 leads.'}}
    else if(g>=max*.5){if(l>=3){cls='g';msg='Sigue: ya tienes 3 leads o más al 50% del máximo.'}else{cls='r';msg='Apágalo: al 50% del máximo necesitabas 3 leads.'}}
    else{cls='n';msg='Todavía es pronto: sigue hasta el 50% del máximo ('+fmt(max*.5)+') y mira si hay 3 leads.'}
    const e=document.getElementById('mt-v');e.className='verdict '+cls;e.textContent=msg;
  }
  if(document.getElementById('fn-precio')){
    const p=num('fn-precio'),c=num('fn-costo'),f=num('fn-flete'),o=num('fn-otros')/100,cpa=num('fn-cpa'),d=Math.min(Math.max(num('fn-dev')/100,0),1),n=num('fn-ped');
    const ent=p-c-f-p*o;const antes=(1-d)*ent-d*f;const u=antes-cpa;
    setT('fn-uped',fmt(u));setT('fn-umes',fmt(u*n));setT('fn-ing',fmt(p*(1-d)*n));
    const inc=p*(1-d)*n;setT('fn-mar',inc?((u*n)/inc*100).toFixed(1)+'%':'-');setT('fn-eq',fmt(Math.max(antes,0)));
    const e=document.getElementById('fn-v');
    if(u>0){e.className='verdict g';e.textContent='Con estas cifras ganas '+fmt(u)+' por pedido creado.'}
    else{e.className='verdict r';e.textContent='Con estas cifras pierdes '+fmt(-u)+' por pedido. Baja el CPA, las devoluciones o sube el precio.'}
  }
  if(document.getElementById('of-out')){
    const g=i=>(document.getElementById(i)||{}).value||'';
    setT('of-out','Ayudo a '+g('of-a')+' a '+g('of-b')+' en '+g('of-c')+', con '+g('of-d')+'.');
  }
  if(document.getElementById('ai-out')){
    const g=i=>(document.getElementById(i)||{}).value||'';
    setT('ai-out',[g('ai-a'),g('ai-i'),g('ai-d'),g('ai-o')].filter(Boolean).join('\n\n'));
  }
  if(document.getElementById('rb-0')){
    let s=0;for(let i=0;i<5;i++){const v=num('rb-'+i);s+=v;setT('rb-v'+i,v)}
    setT('rb-t',s+' / 20');const e=document.getElementById('rb-m');
    e.className='verdict '+(s>=16?'g':s>=10?'w':'r');
    e.textContent=s>=16?'Proyecto sólido: listo para presentar y escalar.':s>=10?'Buen avance: refuerza los puntos con menos puntaje antes de presentar.':'Aún falta base: vuelve a los módulos de los criterios más bajos.';
  }
}
function funnelShow(i){
  const el=document.getElementById('fun-data');if(!el)return;
  const S=JSON.parse(el.textContent),s=S[i];
  document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',+b.dataset.f===i));
  document.getElementById('fun-d').innerHTML=`<div class="grid3"><div class="card"><h3>Pregunta</h3><b>${esc(s[1])}</b></div><div class="card"><h3>Métrica</h3><b>${esc(s[2])}</b></div><div class="card hl"><h3>Si falla</h3><b>${esc(s[3])}</b></div></div>`;
}
function render(id){
  if(!ORDER.includes(id))id='inicio';
  uid=0;
  $('#view').innerHTML=id==='inicio'?viewHome():id==='beneficios'?viewBenefits():viewMod(id);
  const i=ORDER.indexOf(id),prev=ORDER[i-1],next=ORDER[i+1];
  $('#view').insertAdjacentHTML('beforeend',`<div class="pager">${prev?`<button class="btn" data-go="${prev}">← ${esc(TITLES[prev])}</button>`:'<span></span>'}${next?`<button class="btn p" data-go="${next}">${esc(TITLES[next])} →</button>`:'<span></span>'}</div>`);
  $('#crumb').innerHTML=id==='inicio'?'<b>Marketing digital en acción</b>':`<b>${MOD[id]?'Módulo '+N[id]:'Cierre'}</b> · ${esc(TITLES[id])}`;
  document.title=(id==='inicio'?'':TITLES[id]+' · ')+'Leonel Mercado · Contenido Marketing a la Acción';
  paintNav(id);calcAll();funnelShow(0);
  $('#main').scrollTop=0;document.body.classList.remove('open');
  CUR=id;
}
let CUR='inicio';
function go(id){if(location.hash!=='#'+id)location.hash=id;else render(id)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-tab],[data-copy],[data-seen],[data-f]');if(!t)return;
  if(t.dataset.go){go(t.dataset.go)}
  else if(t.dataset.tab){const[g,i]=t.dataset.tab.split(':');const box=t.closest('.tabs');
    box.querySelectorAll('.tb button').forEach(b=>b.classList.toggle('on',b===t));
    box.querySelectorAll('.pn').forEach(p=>p.classList.toggle('on',p.dataset.pn===g+':'+i));}
  else if(t.dataset.copy){const el=document.getElementById(t.dataset.copy),txt=el.textContent;
    const done=()=>{const o=t.textContent;t.textContent='¡Copiado!';setTimeout(()=>t.textContent=o,1400)};
    try{navigator.clipboard.writeText(txt).then(done,()=>{sel(el);t.textContent='Selecciona y copia (Ctrl+C)'})}catch(err){sel(el);t.textContent='Selecciona y copia (Ctrl+C)'}}
  else if(t.dataset.seen){const id=t.dataset.seen;if(seen[id])delete seen[id];else seen[id]=1;save();render(id);enviarAvance(id)}
  else if(t.dataset.f!==undefined){funnelShow(+t.dataset.f)}
});
function sel(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
document.addEventListener('input',calcAll);
window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'inicio'));
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const i=ORDER.indexOf(CUR);
  if(e.key==='ArrowRight'&&ORDER[i+1])go(ORDER[i+1]);
  if(e.key==='ArrowLeft'&&ORDER[i-1])go(ORDER[i-1]);
});
$('#menu').addEventListener('click',()=>document.body.classList.toggle('open'));
$('#present').addEventListener('click',()=>{
  const on=document.body.classList.toggle('present');
  $('#present').textContent=on?'Salir':'Presentar';
  try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
});

/* ---------- registro + envío a Google Sheets ---------- */
const SHEET_URL='https://script.google.com/macros/s/AKfycbxh4sbXMJTe8eg8vcN7j2mOCli0rKfyZHT2BJILYTOCQEsu1glhlpJOY-nkMBA9UE1P/exec'; // pega aquí la URL de la app web de Google Apps Script
let reg=null;try{reg=JSON.parse(localStorage.getItem('curso-reg')||'null')}catch(e){}
function enviar(tipo,datos){
  if(!SHEET_URL)return;
  try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({tipo,fecha:new Date().toISOString()},datos))}).catch(()=>{})}catch(e){}
}
function enviarAvance(id){
  if(!reg)return;
  enviar('avance',{cedula:reg.cedula,nombre:reg.nombre,modulo:TITLES[id]||id,visto:!!seen[id],pct:$('#pct').textContent});
}
buildNav();render(location.hash.slice(1)||'inicio');
(function(){
  const sp=$('#splash');
  let ya=false;try{ya=sessionStorage.getItem('entro')==='1'}catch(e){}
  if(ya){sp.style.transition='none';sp.classList.add('out');void sp.offsetHeight;sp.style.transition=''}
  const R=$('#reg'),F=$('#regf');
  function pedirReg(){R.classList.add('on');setTimeout(()=>F.nombre.focus(),50)}
  F.addEventListener('submit',e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(F));
    const ok=['nombre','cedula','telefono','correo','entidad','grupo'].every(k=>(d[k]||'').trim());
    if(!ok||!F.correo.validity.valid||!F.acepto.checked){$('#regerr').textContent=!F.acepto.checked&&ok?'Debes aceptar el tratamiento de datos.':'Completa todos los campos obligatorios con un correo válido.';return}
    $('#regerr').textContent='';
    delete d.acepto;Object.keys(d).forEach(k=>d[k]=d[k].trim());
    reg=d;try{localStorage.setItem('curso-reg',JSON.stringify(d))}catch(e){}
    enviar('registro',d);R.classList.remove('on');entrar();
  });
  function entrar(){
    sp.classList.add('out');document.body.classList.remove('open');
    try{sessionStorage.setItem('entro','1')}catch(e){}
  }
  function volver(){
    sp.classList.remove('out');
    try{sessionStorage.removeItem('entro')}catch(e){}
    setTimeout(()=>$('#enter').focus(),50);
  }
  $('#enter').addEventListener('click',()=>{if(reg)entrar();else pedirReg()});
  $('#home-brand').addEventListener('click',volver);
  if(!ya)$('#enter').focus();
})();
</script>
